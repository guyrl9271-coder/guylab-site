<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의하기 - 예산가계부</title>
    <style>
        :root {
            --primary-bg: #fbfbfd;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --accent: #0066cc;
            --card-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-main);
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: var(--accent);
        }

        a:hover {
            text-decoration: underline;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 52px;
            background: rgba(251, 251, 253, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-content {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .back-link {
            color: var(--text-muted);
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--text-main);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 140px 20px 80px;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        .content-box {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.03);
        }

        h2 {
            font-size: 18px;
            font-weight: 600;
            margin-top: 32px;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        h2:first-child {
            margin-top: 0;
        }

        p {
            font-size: 15px;
            color: #434347;
            margin-bottom: 12px;
        }

        .email-box {
            background: #f5f5f7;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            font-weight: 600;
            text-align: center;
        }

        footer {
            background: #f5f5f7;
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid #d2d2d7;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 24px;
            margin-bottom: 24px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .copyright {
            font-size: 12px;
            color: #a1a1a6;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-content">
            <a href="index.html" class="back-link">← 홈으로 돌아가기</a>
            <div style="font-weight: 600;">예산가계부</div>
        </div>
    </nav>

    <main class="container">
        <h1>문의 및 지원</h1>
        <div class="subtitle">예산가계부 고객지원 센터</div>

        <div class="content-box">
            <h2>고객 센터 안내</h2>
            <p>서비스 이용 중 불편한 점, 기능 제안, 혹은 계정 삭제 요청 등의 문의 사항이 있으신 경우 아래 이메일로 연락해 주시기 바랍니다.</p>

            <div class="email-box">
                이메일: <a href="mailto:guylab@gmail.com">guylab@gmail.com</a>
            </div>

            <p>보내주신 문의는 확인 후 영업일 기준 2~3일 이내에 신속하게 답변해 드리겠습니다.</p>
        </div>
    </main>

    <footer>
        <div class="footer-links">
            <a href="terms.html">이용약관</a>
            <a href="privacy.html">개인정보처리방침</a>
            <a href="delete-account.html">계정 삭제 안내</a>
            <a href="contact.html">문의 및 지원</a>
        </div>
        <div class="copyright">
            &copy; 2026 Waymaker. All rights reserved.
        </div>
    </footer>

</body>
</html>
