<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Waymaker 공식 앱 포트폴리오 - 예산가계부, 사용기한 계산기">
    <title>Apps - Waymaker</title>
    <style>
        :root {
            --primary-bg: #fbfbfd;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --accent: #0066cc;
            --card-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-main);
            line-height: 1.5;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 52px;
            background: rgba(251, 251, 253, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-content {
            width: 100%;
            max-width: 980px;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
        }

        /* Hero Section */
        .hero {
            padding: 160px 20px 60px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
        }

        .hero p {
            font-size: 20px;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Apps Section */
        .apps-section {
            padding: 40px 20px 100px;
            max-width: 900px;
            margin: 0 auto;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .app-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(0,0,0,0.04);
        }

        .app-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.08);
        }

        .app-icon {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
        }

        .icon-budget {
            background: linear-gradient(135deg, #0F766E, #16A34A);
        }

        .icon-expiry {
            background: linear-gradient(135deg, #2563EB, #6366F1);
        }

        .app-card h3 {
            font-size: 24px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .app-card p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .app-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s, color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background-color: var(--text-main);
            color: white;
        }

        .btn-primary:hover {
            background-color: #333;
        }

        .btn-secondary {
            background-color: #f1f1f3;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #e5e5ea;
        }

        /* Footer */
        footer {
            background: #f5f5f7;
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid #d2d2d7;
        }

        .copyright {
            font-size: 12px;
            color: #a1a1a6;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 36px; }
            .hero p { font-size: 18px; }
        }
    </style>
</head>
<body>

    <!-- 내비게이션 바 -->
    <nav>
        <div class="nav-content">
            <div class="logo">Waymaker Apps</div>
        </div>
    </nav>

    <!-- 히어로 섹션 -->
    <main>
        <section class="hero">
            <h1>스마트한 일상을 위한 앱</h1>
            <p>일상에 가치를 더하는 Waymaker의 모바일 애플리케이션을 만나보세요.</p>
        </section>

        <!-- 앱 목록 섹션 -->
        <section class="apps-section">
            <div class="app-grid">
                
                <!-- 앱 1: 예산가계부 -->
                <div class="app-card">
                    <div>
                        <div class="app-icon icon-budget">₩</div>
                        <h3>예산가계부</h3>
                        <p>직관적인 예산 관리와 브루탈리즘 스타일의 고품질 PDF 리포트로 자산을 스마트하게 기록하고 분석하세요.</p>
                    </div>
                    <div class="app-links">
                        <a href="budget/index.html" class="btn btn-primary">공식 홈페이지</a>
                        <a href="budget/privacy.html" class="btn btn-secondary">개인정보처리방침</a>
                    </div>
                </div>

                <!-- 앱 2: 사용기한 계산기 -->
                <div class="app-card">
                    <div>
                        <div class="app-icon icon-expiry">⏳</div>
                        <h3>사용기한 계산기</h3>
                        <p>식품, 화장품, 생활용품 등 일상 속 다양한 물품의 유통기한과 남은 사용 기간을 놓치지 않고 관리하세요.</p>
                    </div>
                    <div class="app-links">
                        <a href="#" class="btn btn-primary" onclick="alert('출시 준비 중입니다!')">공식 홈페이지</a>
                        <a href="budget/privacy.html" class="btn btn-secondary">개인정보처리방침</a>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <!-- 푸터 -->
    <footer>
        <div class="copyright">
            &copy; 2026 Waymaker. All rights reserved.
        </div>
    </footer>

</body>
</html>
